<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moofile manage view</title>
    <style>
      body {
       margin: 0 !important;
       padding: 0 !important;
       height: 100vh;
       width: 100vw;
      }
      * {
        box-sizing: border-box;
      }
      /* 加载动画样式 */
    .loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      transition: opacity 0.3s ease;
    }
    .loader::after {
      content: "";
      width: 48px;
      height: 48px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    /* 应用加载后隐藏加载动画 */
    .loaded .loader {
      opacity: 0;
      pointer-events: none;
    }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div class="loader"></div>

    <script>
      // 监听应用加载完成事件
      window.addEventListener('load', () => {
        setTimeout(() => {
          document.body.classList.add('loaded');
        }, 300);
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
